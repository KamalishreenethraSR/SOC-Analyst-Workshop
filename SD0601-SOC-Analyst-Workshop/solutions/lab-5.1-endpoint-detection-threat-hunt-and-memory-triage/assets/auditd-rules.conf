# ─────────────────────────────────────────────────────────────────
# auditd Rules — Lab 5.1
# SD0601 SOC Analyst Workshop
# Ubuntu 22.04 VM
#
# Install:
#   sudo cp auditd-rules.conf /etc/audit/rules.d/soc-lab.rules
#   sudo auditctl -R /etc/audit/rules.d/soc-lab.rules
#   sudo systemctl restart auditd
#
# Query events:
#   sudo ausearch -k <key>
#   sudo ausearch -k passwd_watch | aureport --summary
# ─────────────────────────────────────────────────────────────────

# ── Delete all existing rules first ──────────────────────────────
-D

# ── Set buffer size ───────────────────────────────────────────────
-b 8192

# ── Failure mode: log failures ────────────────────────────────────
-f 1

# ════════════════════════════════════════════════════════════════
# IDENTITY AND AUTHENTICATION
# ════════════════════════════════════════════════════════════════

# Monitor /etc/passwd modifications (Lab 5.1 Step 3)
-w /etc/passwd -p wa -k passwd_watch

# Monitor /etc/shadow (credential store)
-w /etc/shadow -p wa -k shadow_watch

# Monitor /etc/sudoers and sudoers.d
-w /etc/sudoers -p wa -k sudoers_watch
-w /etc/sudoers.d/ -p wa -k sudoers_watch

# Monitor /etc/group changes
-w /etc/group -p wa -k group_watch

# Monitor /etc/gshadow
-w /etc/gshadow -p wa -k gshadow_watch

# Monitor user database tools
-w /usr/sbin/useradd -p x -k useradd_exec
-w /usr/sbin/userdel -p x -k userdel_exec
-w /usr/sbin/usermod -p x -k usermod_exec
-w /usr/sbin/groupadd -p x -k groupadd_exec
-w /usr/sbin/passwd -p x -k passwd_exec

# ════════════════════════════════════════════════════════════════
# PRIVILEGE ESCALATION
# ════════════════════════════════════════════════════════════════

# Monitor sudo execution
-w /usr/bin/sudo -p x -k sudo_exec

# Monitor su execution
-w /bin/su -p x -k su_exec

# Monitor pkexec (polkit)
-w /usr/bin/pkexec -p x -k pkexec_exec

# ════════════════════════════════════════════════════════════════
# PROCESS EXECUTION — SUSPICIOUS COMMANDS
# ════════════════════════════════════════════════════════════════

# Monitor common recon/execution tools
-w /usr/bin/wget -p x -k wget_exec
-w /usr/bin/curl -p x -k curl_exec
-w /usr/bin/nc -p x -k netcat_exec
-w /usr/bin/ncat -p x -k ncat_exec
-w /usr/bin/nmap -p x -k nmap_exec
-w /usr/bin/python3 -p x -k python3_exec
-w /usr/bin/perl -p x -k perl_exec

# Monitor shell spawning from unexpected paths
-a always,exit -F arch=b64 -S execve -F path=/bin/bash -F uid>=1000 -k shell_exec_user
-a always,exit -F arch=b64 -S execve -F path=/bin/sh -F uid>=1000 -k sh_exec_user

# ════════════════════════════════════════════════════════════════
# PERSISTENCE MECHANISMS
# ════════════════════════════════════════════════════════════════

# Monitor crontab changes
-w /etc/cron.d/ -p wa -k cron_watch
-w /etc/cron.daily/ -p wa -k cron_watch
-w /etc/cron.hourly/ -p wa -k cron_watch
-w /etc/cron.weekly/ -p wa -k cron_watch
-w /etc/crontab -p wa -k crontab_watch
-w /var/spool/cron/ -p wa -k cron_user_watch

# Monitor systemd service creation
-w /etc/systemd/system/ -p wa -k systemd_service_watch
-w /lib/systemd/system/ -p wa -k systemd_service_watch
-w /usr/lib/systemd/system/ -p wa -k systemd_service_watch

# Monitor rc.local / init scripts
-w /etc/rc.local -p wa -k init_script_watch
-w /etc/init.d/ -p wa -k init_script_watch

# Monitor authorized_keys (SSH persistence)
-a always,exit -F arch=b64 -S open -F path=/home -F a1&0100 -k ssh_authorized_keys
-w /root/.ssh/ -p wa -k root_ssh_watch

# ════════════════════════════════════════════════════════════════
# FILE INTEGRITY — SENSITIVE DIRECTORIES
# ════════════════════════════════════════════════════════════════

# Monitor /tmp for executable drops
-w /tmp/ -p wx -k tmp_exec_write
-w /var/tmp/ -p wx -k vartmp_exec_write

# Monitor /sbin, /usr/sbin for binary replacements
-w /sbin/ -p wa -k sbin_write
-w /usr/sbin/ -p wa -k usr_sbin_write

# Monitor kernel module loading (T1547.006)
-w /sbin/insmod -p x -k kernel_module_load
-w /sbin/modprobe -p x -k kernel_module_load
-a always,exit -F arch=b64 -S init_module,finit_module -k kernel_module_load

# ════════════════════════════════════════════════════════════════
# NETWORK — SOCKET CREATION (detect bind shells)
# ════════════════════════════════════════════════════════════════

-a always,exit -F arch=b64 -S socket -F a0=2 -k ipv4_socket_create
-a always,exit -F arch=b64 -S connect -k outbound_connect

# ── Make rules immutable (cannot be changed without reboot) ───────
# Uncomment in production environments:
# -e 2
