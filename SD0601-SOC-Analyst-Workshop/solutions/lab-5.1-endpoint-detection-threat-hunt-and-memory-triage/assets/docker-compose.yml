version: "3.8"

# ──────────────────────────────────────────────────────────────────
#  Lab 5.1 — Wazuh Manager Stack
#  SD0601 SOC Analyst Workshop
#
#  Services:
#    - Wazuh Manager   :55000  (API)
#    - Wazuh Dashboard :443    (Web UI)
#    - Elasticsearch   :9200   (Wazuh indexer)
#
#  Usage:
#    docker compose up -d
#    docker compose ps
#    docker compose logs -f wazuh-manager
#    docker compose down -v
#
#  Agent enrolment:
#    Windows: msiexec /i wazuh-agent.msi WAZUH_MANAGER="<host_ip>" /q
#    Linux:   WAZUH_MANAGER="<host_ip>" apt install wazuh-agent
# ──────────────────────────────────────────────────────────────────

services:

  # ── Wazuh Manager ─────────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh-manager
    hostname: wazuh-manager
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh
      - API_PASSWORD=wazuh
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
    ports:
      - "1514:1514"     # Syslog listener
      - "1515:1515"     # Agent registration
      - "514:514/udp"   # Remote syslog
      - "55000:55000"   # REST API
    healthcheck:
      test: ["CMD", "curl", "-sk", "-u", "wazuh:wazuh", "https://localhost:55000/"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - soc-lab

  # ── Wazuh Indexer (Elasticsearch) ─────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh-indexer
    hostname: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:SecretPassword https://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - soc-lab

  # ── Wazuh Dashboard ───────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh-dashboard
    hostname: wazuh-dashboard
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh
      - API_PASSWORD=wazuh
    ports:
      - "443:5601"
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    networks:
      - soc-lab

volumes:
  wazuh-api-configuration:
  wazuh-etc:
  wazuh-logs:
  wazuh-queue:
  wazuh-var-multigroups:
  wazuh-integrations:
  wazuh-active-response:
  wazuh-agentless:
  wazuh-wodles:
  filebeat-etc:
  filebeat-var:
  wazuh-indexer-data:

networks:
  soc-lab:
    driver: bridge

# ──────────────────────────────────────────────────────────────
# Access:
#   Wazuh Dashboard: https://localhost:443  (admin / SecretPassword)
#   Wazuh API:       https://localhost:55000 (wazuh / wazuh)
#   Wazuh Indexer:   https://localhost:9200  (admin / SecretPassword)
# ──────────────────────────────────────────────────────────────
