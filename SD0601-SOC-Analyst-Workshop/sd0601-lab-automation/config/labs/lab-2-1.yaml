required_accounts: ["student"]
required_dashboards: ["Kibana Log Overview"]
required_alerts: ["SSH Brute Force Correlation"]
verification_tests:
  - "elasticsearch_cluster_green"
  - "kibana_status_available"
  - "sysmon_events_searchable"
  - "windows_security_searchable"
  - "linux_auth_searchable"
  - "brute_force_rule_active"
reset_procedure: "purge_indices_and_recreate_mappings"
deliverables:
  - "pipeline-verification-report.md"
