lab_id: "2.1"
module: 2
title: "Log Pipeline: Endpoint to SIEM"
required_vms: ["windows_victim", "ubuntu_analyst"]
required_services: ["elasticsearch", "kibana"]
required_datasets: ["windows_security", "sysmon_events", "linux_auth"]
